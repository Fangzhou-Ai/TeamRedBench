notes:
  - peak_compute_tops uses dense matrix or tensor peaks so GEMM-based MFU compares against the relevant published limit.
  - float8_e4m3fn and float8_e5m2 map to AMD's published dense OCP-FP8 matrix peak for MI355X.
  - peak_link_bandwidth_gbps.xgmi uses the published 8-GPU ring aggregate peer-to-peer bandwidth.
  - peak_link_bandwidth_gbps.network is intentionally null because inter-node limits depend on the installed NIC and fabric.


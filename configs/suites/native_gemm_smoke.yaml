name: native-gemm-smoke
device:
  profile: ../profiles/hardware/cdna_generic.yaml
runtime:
  profile: ../profiles/rocm/rocm_generic.yaml
plugins: []
outputs:
  directory: ../../results/native_gemm_smoke
  formats:
    - json
    - csv
benchmarks:
  - benchmark: mfu
    metrics:
      - achieved_tops
      - mfu_pct
      - latency_us
    params:
      backend: native
      dtypes:
        - float16
        - bfloat16
        - float32
        - float64
      shapes:
        - [4096, 4096, 4096]
      warmup: 5
      iterations: 20
      native:
        kernel: mfu_hipblas
